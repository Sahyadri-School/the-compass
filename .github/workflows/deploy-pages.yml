name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check internal links (including in-page anchors)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          # --offline: don't hit the network for external URLs (mailto:,
          # Google Fonts, CDNs) — this only verifies local file paths and
          # in-page #anchors actually exist, which is what tends to break
          # when a page or a section id gets renamed.
          # Informational only (continue-on-error): a false positive here
          # (e.g. an absolute production-only path, or a data: favicon)
          # should never block a real deploy. Check the Actions run summary
          # for anything it flags and fix it by hand if it's a real break.
          args: --offline --no-progress './*.html'
          fail: false

      - name: Lighthouse CI (accessibility & performance report)
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          staticDistDir: "."
          urls: |
            /index.html
            /submit.html
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Renders each PDF's cover and front-matter pages to JPEGs for the
      # cover previews (see scripts/build-previews.js). continue-on-error:
      # if this fails for any reason the deploy still goes ahead, and the
      # site simply falls back to its generated covers with no Preview button.
      - name: Generate cover and preview images from the PDFs
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          node scripts/build-previews.js

      - name: Build issues.json from data/issues/
        run: node scripts/build-issues-index.js --with-previews

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site (exclude non-site files)
        run: |
          mkdir _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='.gitignore' --exclude='scripts' --exclude='data/issues' \
            ./ _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

