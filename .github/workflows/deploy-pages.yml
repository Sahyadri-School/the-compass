name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 404.html's "Return to The Compass" link is root-relative
      # ("/the-compass/"), which is correct for the deployed GitHub Pages
      # URL but has no real local path lychee could resolve it against
      # (there's no "the-compass" folder in this checkout — that's a URL
      # path, not a directory). --root-dir alone would make lychee look
      # for one and report "file not found"; standing in a placeholder
      # here (only in this throwaway checkout, never committed or
      # deployed) lets --root-dir resolve it to a real file like any
      # other internal link, instead of a permanent known-false-positive.
      - name: Stand in a placeholder for the deployed site's own path
        run: mkdir -p the-compass && echo "placeholder for lychee's --root-dir — see deploy-pages.yml" > the-compass/index.html

      - name: Check internal links (including in-page anchors)
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true
        with:
          # --offline: don't hit the network for external URLs (mailto:,
          # Google Fonts, CDNs) — this only verifies local file paths and
          # in-page #anchors actually exist, which is what tends to break
          # when a page or a section id gets renamed.
          # --root-dir: resolves 404.html's "/the-compass/" link against
          # the placeholder directory above instead of reporting it as
          # unresolvable.
          # Informational only (continue-on-error): a false positive here
          # should never block a real deploy. Check the Actions run
          # summary for anything it flags and fix it by hand if it's real.
          args: --offline --no-progress --root-dir . './*.html'
          fail: false

      # treosh/lighthouse-ci-action v12 dropped its old `staticDistDir`
      # input (it now only hits real URLs), so the site needs to be served
      # locally first — otherwise it tries to fetch the literal string
      # "/index.html" as a URL and fails with INVALID_URL.
      - name: Serve the site locally for Lighthouse
        run: |
          python3 -m http.server 8080 &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8080/index.html >/dev/null && break
            sleep 0.5
          done

      - name: Lighthouse CI (accessibility & performance report)
        uses: treosh/lighthouse-ci-action@v12
        continue-on-error: true
        with:
          urls: |
            http://localhost:8080/index.html
            http://localhost:8080/submit.html
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    needs: checks
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Renders every page of each PDF to a JPEG for the covers and the page
      # viewer (see scripts/build-previews.js). That takes about a minute, so
      # the result is cached and only redone when a PDF (or the script)
      # changes -- a typo fix in the README doesn't re-render 1,500+ pages.
      #
      # continue-on-error: if generation fails for any reason the deploy still
      # goes ahead, and the site simply falls back to its drawn covers with no
      # Preview button. The cache is saved only when generation fully
      # succeeded, so a partial failure can never get locked in.
      - name: Restore cached previews
        id: previews-cache
        uses: actions/cache/restore@v4
        with:
          path: previews
          key: previews-${{ hashFiles('pdfs/*.pdf', 'scripts/build-previews.js') }}

      - name: Generate cover and page images from the PDFs
        id: previews-build
        if: steps.previews-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          node scripts/build-previews.js

      - name: Save previews to the cache
        if: steps.previews-build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: previews
          key: previews-${{ hashFiles('pdfs/*.pdf', 'scripts/build-previews.js') }}

      - name: Build issues.json from data/issues/
        run: node scripts/build-issues-index.js --with-previews

      # A static landing page per issue (for search engines and direct
      # links), the sitemap listing them, and an RSS feed linking to them —
      # all derived from data/issues.json, so they stay in sync with it.
      - name: Build per-issue pages, sitemap, and RSS feed
        run: |
          node scripts/build-issue-pages.js
          node scripts/build-sitemap.js
          node scripts/build-feed.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site (exclude non-site files)
        run: |
          mkdir _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' \
            --exclude='.gitignore' --exclude='scripts' --exclude='data/issues' \
            ./ _site/

          # 404.html's "Return to The Compass" link is hardcoded to this
          # repo's current project-page path. If a CNAME file ever puts the
          # site on a custom domain (served from "/" instead), repoint it —
          # so the link doesn't quietly 404 after a domain change.
          if [ -f _site/CNAME ]; then
            sed -i 's#href="/the-compass/"#href="/"#' _site/404.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

