# Pages CMS configuration — https://pagescms.org
#
# This lets you add a new magazine issue by filling in a simple web form —
# no code, no GitHub website, nothing technical. Every time you click Save,
# it publishes straight to the live website; the new issue is usually
# visible within a minute or two.
#
# HOW ISSUES ARE STORED (read this before changing the model below):
# Each issue is its own file under data/issues/ (e.g. data/issues/3-4.json).
# That's what Pages CMS edits, and — because it's a `type: collection`, not
# a single file — Pages CMS can sort its own "Magazine issues" list by date,
# newest first (see `view` below). A `type: file` with a single JSON array
# doesn't support that sorting at all, which is why it's not modeled that
# way.
#
# The website itself doesn't read data/issues/ directly — a static site
# can't list a folder's contents at runtime. Instead, scripts/build-issues-
# index.js combines every file in data/issues/ into one array at
# data/issues.json, which is what index.html actually fetches. The deploy
# workflow (.github/workflows/deploy-pages.yml) runs that script on every
# push automatically, so this is invisible to whoever's just adding an
# issue through the form. DO NOT hand-edit data/issues.json — it's
# regenerated from data/issues/ on every deploy, so direct edits there get
# silently overwritten. Edit the files in data/issues/ instead.
#
# NOTE ON PATHS: media.output below is deliberately relative (no leading
# "/"), not the more common "/pdfs" style shown in Pages CMS's own docs.
# That's because this site is hosted at a GitHub Pages *project* URL
# (…github.io/the-compass/) rather than at a domain root, so a leading-slash
# path would resolve one level too high and 404. Keep it relative.

media:
  - name: issue-pdfs
    label: Issue PDFs
    input: pdfs
    output: pdfs
    categories: [document]
  - name: issue-covers
    label: Issue covers
    input: covers
    output: covers
    categories: [image]

content:
  - name: issues
    label: "Magazine issues"
    type: collection
    path: data/issues
    format: json
    filename: "{fields.id}.json"
    view:
      fields: [id, month, year]
      primary: id
      sort: [year, volume, number]
      default:
        sort: year
        order: desc
    fields:
      - name: volume
        label: "Volume number"
        description: "Which volume this issue belongs to. A volume is a group of issues, usually one per year — so all issues published in the same year normally share the same volume number. Just type the number, e.g. 3."
        type: number
        required: true

      - name: number
        label: "Issue number (within that volume)"
        description: "Which issue this is inside the volume above — 1 for the first issue of that volume, 2 for the second, 3 for the third, and so on."
        type: number
        required: true

      - name: month
        label: "Month published"
        type: select
        options:
          values: [January, February, March, April, May, June, July, August, September, October, November, December]
        required: true

      - name: year
        label: "Year published"
        type: number
        required: true

      - name: id
        label: "Issue code"
        description: "A short code combining the two numbers above: Volume, then a dash, then Issue number. Example: Volume 3, Issue 4 → write 3-4. This is also used as the file name, so it needs to be unique — don't reuse a code you've already used for another issue."
        type: string
        required: true

      - name: file
        label: "Upload the issue (PDF)"
        description: "Click here to upload the magazine issue as a PDF. This is the actual file that visitors will download from the website, so make sure it's the final, finished version."
        type: file
        media: issue-pdfs
        categories: [document]
        extensions: [pdf]
        required: true

      - name: cover
        label: "Cover picture (optional)"
        description: "A picture of the issue's cover, shown on the website next to the download button. You can leave this blank — the site will automatically draw a simple placeholder cover instead. If you do upload one, a tall (portrait) image works best, roughly 600 pixels wide by 850 pixels tall."
        type: image
        media: issue-covers
